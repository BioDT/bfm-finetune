[project]
name = "bfm-finetune"
version = "0.2.0"
description = "Evaluation and fine-tuning benchmarks for BioAnalyst, the Biodiversity Foundation Model"
authors = [
    {name = "Thanasis Trantas"},
    {name = "Martino Mensio"},
    {name = "Taimur Khan"},
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dynamic = ["dependencies"]

[tool.poetry.dependencies]
bfm-model = { path = "./bfm-model/", develop = true }
microsoft-aurora = ">=2.0.1,<3.0.0"
mlflow = ">=3.1.1,<4.0.0"
hydra-core = ">=1.3.2,<2.0.0"
plotly = ">=5.24.1,<7.0.0"
scikit-learn = ">=1.6.1,<2.0.0"
scikit-image = ">=0.25.2,<0.26.0"
statsmodels = ">=0.14.4,<0.15.0"
seaborn = ">=0.13.2,<0.14.0"
properscoring = ">=0.1,<0.2"
cartopy = ">=0.24.1,<0.25.0"
pyproj = ">=3.7.0,<4.0.0"
rasterio = "^1.4.3"
rioxarray = "^0.19.0"
tifffile = "^2025.5.10"
pyarrow = ">=19.0.0"
joblib = ">=1.4.2,<2.0.0"
requests = ">=2.32.0,<3.0.0"
typer = ">=0.15.2,<0.16.0"

# Prithvi-WxC gravity-wave experiments only; needs the gravity-wave-finetuning submodule.
#   poetry install --with prithvi
[tool.poetry.group.prithvi]
optional = true

[tool.poetry.group.prithvi.dependencies]
gravity-wave-finetuning = { path = "./gravity-wave-finetuning/", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
ruff = ">=0.9"
pytest = "^8.3.5"
ipykernel = "^6.29.5"
nbformat = "^5.10.4"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
